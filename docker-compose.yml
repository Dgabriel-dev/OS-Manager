name: ordem-de-servico

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: os-nginx
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/snippets:/etc/nginx/snippets:ro
    depends_on:
      - php
    networks:
      - os-network
    restart: unless-stopped

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: os-php-fpm
    volumes:
      - ./backend:/var/www/html
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini:ro
    env_file:
      - ./backend/.env
    depends_on:
      - postgres
      - redis
    networks:
      - os-network
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    container_name: os-postgres
    environment:
      POSTGRES_USER: ordem_user
      POSTGRES_PASSWORD: secret_password
      POSTGRES_DB: ordem_servico
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - os-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: os-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - os-network
    restart: unless-stopped

  mailhog:
    image: mailhog/mailhog:latest
    container_name: os-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - os-network
    restart: unless-stopped

networks:
  os-network:
    driver: bridge

volumes:
  pgdata:
  redisdata:
